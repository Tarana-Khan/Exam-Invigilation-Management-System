server.port=8081
spring.application.name=ExamInvigilationSystem
# MySQL Connection
spring.datasource.url=jdbc:mysql://localhost:3306/exam_invigilation_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root

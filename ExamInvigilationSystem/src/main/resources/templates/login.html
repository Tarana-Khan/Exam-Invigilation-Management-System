<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Login - Exam Invigilation System</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh;display:flex;background:#0f172a;overflow:hidden}
.left{flex:1.1;background:linear-gradient(160deg,#4f46e5,#7c3aed 45%,#db2777);color:white;padding:48px 52px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}
.left::after{content:'';position:absolute;width:420px;height:420px;background:rgba(255,255,255,.12);border-radius:50%;right:-120px;bottom:-120px}
.left::before{content:'';position:absolute;width:280px;height:280px;border:1px solid rgba(255,255,255,.25);border-radius:50%;left:-80px;top:-60px}
.logo{font-size:14px;letter-spacing:2px;font-weight:800;background:rgba(255,255,255,.18);width:fit-content;padding:8px 14px;border-radius:999px;backdrop-filter:blur(10px);z-index:1}
.left h1{font-size:48px;line-height:1.05;margin:22px 0 14px;z-index:1}
.left p{opacity:.85;line-height:1.6;max-width:460px;z-index:1}
.stats{display:flex;gap:16px;margin-top:28px;z-index:1}
.stat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.2);padding:14px 16px;border-radius:16px;flex:1;backdrop-filter:blur(10px)}
.stat b{font-size:22px;display:block}
.stat span{font-size:12px;opacity:.85}
.right{flex:1;background:#f8fafc;display:flex;align-items:center;justify-content:center;padding:30px}
.card{background:white;width:100%;max-width:420px;padding:36px;border-radius:24px;box-shadow:0 20px 50px rgba(0,0,0,.08);border:1px solid #e2e8f0}
.card h2{font-size:28px;color:#0f172a}
.card .sub{color:#64748b;font-size:14px;margin:6px 0 22px}
label{font-size:13px;font-weight:700;color:#334155;display:block;margin:14px 0 6px}
input{width:100%;padding:13px 14px 13px 44px;border:1.5px solid #e2e8f0;border-radius:12px;outline:none;font-size:14px;background:#f8fafc;transition:.2s}
input:focus{border-color:#6366f1;background:white;box-shadow:0 0 0 4px #e0e7ff}
.field{position:relative}
.field span{position:absolute;left:14px;top:50%;transform:translateY(-50%);font-size:18px}
button{width:100%;padding:14px;background:#4f46e5;color:white;border:none;border-radius:12px;font-weight:800;font-size:15px;margin-top:22px;cursor:pointer;transition:.2s}
button:hover{background:#4338ca;transform:translateY(-1px);box-shadow:0 10px 20px rgba(79,70,229,.25)}
.error{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:600}
.demo{margin-top:18px;background:#eef2ff;border:1px dashed #c7d2fe;padding:12px;border-radius:12px;font-size:12.5px;color:#4338ca;line-height:1.6;text-align:center}
.demo b{cursor:pointer}
.demo b:hover{text-decoration:underline}
@media(max-width:900px){.left{display:none}.right{padding:16px}}
</style>
</head>
<body>
<div class="left">
<div class="logo">✦ EXAM INVIGILATION SYSTEM</div>
<div>
<h1>Duty Allocation<br>Zero Clashes.</h1>
<p>Faculty availability, exam slots and classroom duties
</div>
<p style="font-size:12px;opacity:.7">© 2026 Exam Invigilation System • Secure Login</p>
</div>

<div class="right">
<div class="card">
<h2>Welcome back</h2>
<p class="sub">Please login to continue to your dashboard</p>
<p class="error" th:if="${error}" th:text="${error}"></p>
<form action="/login" method="post">
<label>Username</label>
<div class="field"><span>👤</span><input id="username" type="text" name="username" placeholder="Enter username" required></div>
<label>Password</label>
<div class="field"><span>🔒</span><input id="password" type="password" name="password" placeholder="Enter password" required></div>
<button type="submit">Login →</button>
</form>
</div>
</div>
<script>
function fill(u,p){document.getElementById('username').value=u;document.getElementById('password').value=p;}
</script>
</body>
</html>

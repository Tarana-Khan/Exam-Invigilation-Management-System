<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Login - Exam Invigilation System</title>
<style>
body{font-family:'Segoe UI',Arial;background:linear-gradient(135deg,#eef2ff,#fdf2f8,#ecfeff);display:flex;justify-content:center;align-items:center;height:100vh;margin:0}
.box{background:white;padding:35px 30px;border-radius:20px;width:340px;box-shadow:0 10px 30px rgba(99,102,241,0.15);text-align:center;border:1px solid #e0e7ff}
.box h2{color:#3730a3;margin:0 0 5px 0;font-size:22px}
.box h3{color:#6366f1;margin:5px 0 20px 0;font-weight:600}
.subtitle{color:#64748b;font-size:13px;margin-bottom:20px}
input{width:92%;padding:12px;margin:8px 0;border-radius:10px;border:1px solid #c7d2fe;background:#f8fafc;outline:none;font-size:14px}
input:focus{border-color:#818cf8;background:white}
button{width:98%;padding:12px;background:#818cf8;color:white;border:none;border-radius:10px;cursor:pointer;font-weight:bold;font-size:15px;margin-top:10px}
button:hover{background:#6366f1}
.error{color:#b91c1c;background:#fee2e2;padding:8px;border-radius:8px;font-size:13px}
.footer{color:#94a3b8;font-size:11px;margin-top:18px}
</style>
</head>
<body>
<div class="box">
<h2>Exam Invigilation System</h2>
<h3>Login</h3>
<p class="subtitle">Welcome back, please login to continue</p>

<p class="error" th:if="${error}" th:text="${error}"></p>

<form action="/login" method="post">
<input type="text" name="username" placeholder="Username" required><br>
<input type="password" name="password" placeholder="Password" required><br>
<button type="submit">Login</button>
</form>
<p class="footer">Admin & Faculty Login</p>
</div>
</body>
</html>
